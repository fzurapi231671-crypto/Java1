<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Java 1</title>
</head>

  <body>
    <label>Numri pare</label>
   <input type="number" id="nr1">
  <br>
    <label>Numri dyte</label>
   <input type="number" id="nr2">
    <br>
    <button type="submit" onclick="sum()">+</button>
    <p id="result"></p>
    <button type="submit" onclick="zbritje()">-</button>
    <p id="result1"></p>

    <button type="submit" onclick="times()">*</button>
    <p id="result2"></p>

     <button type="submit" onclick="pqestimi()">/</button>
    <p id="result3"></p>
    
    <script>
    function sum() 
    {
    var a=Number(document.getElementById('nr1').value);
    var b=Number(document.getElementById('nr2').value);
    var c = a + b;
    document.getElementById('result').innerHTML =c;
    }
      function zbritje() 
    {
    var a=Number(document.getElementById('nr1').value);
    var b=Number(document.getElementById('nr2').value);
    var c = a - b;
    document.getElementById('result1').innerHTML =c;
    }
      function times() 
    {
    var a=Number(document.getElementById('nr1').value);
    var b=Number(document.getElementById('nr2').value);
    var c = a * b;
    document.getElementById('result2').innerHTML =c;
    }
      function pqestimi() 
    {
    var a=Number(document.getElementById('nr1').value);
    var b=Number(document.getElementById('nr2').value);
    var c = a / b;
    document.getElementById('result3').innerHTML =c;
    }
      
    </script>
    
  </body>
  
</html>
